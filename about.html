    <!--==================== i18n 预加载：首屏直接使用语言文件，避免闪烁====================-->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lang');
          var lang = saved && ['cn', 'en', 'jp'].indexOf(saved) !== -1 ? saved : 'en';
          document.documentElement.lang = lang === 'cn' ? 'zh-CN' : lang === 'jp' ? 'ja' : 'en';
          document.documentElement.classList.add('i18n-loading');
          window.__I18N_LANG__ = lang;
          window.__I18N_READY__ = fetch('assets/i18n/i18n_' + lang + '.json')
            .then(function (r) { return r.json(); })
            .then(function (data) { window.__I18N_DATA__ = data; })
            .catch(function () { /* 加载失败则保留默认文本*/ });
        } catch (e) { /* 忽略 */ }
      })();
    </script>
